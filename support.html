
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پشتیبانی | VPLUS PART</title>

  <link rel="stylesheet" href="assets/style.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <header class="simple-head">
    <a class="logo" href="index.html">
      <b>V+</b>
      <span>
        VPLUS PART
        <small>PARTS & COMPONENTS</small>
      </span>
    </a>

    <a href="index.html">بازگشت به فروشگاه ←</a>
  </header>

  <main class="wrap page-wrap narrow">

    <div class="page-title">
      <span class="eyebrow">CUSTOMER CARE</span>

      <h1>پشتیبانی مشتریان</h1>

      <p>
        درخواست خود را ثبت کن؛ کد پیگیری برایت نمایش داده می‌شود.
      </p>
    </div>

    <section class="panel">

      <form id="supportForm" class="form-grid">

        <label>
          نام و نام خانوادگی
          <input
            type="text"
            name="name"
            required
            maxlength="100"
          >
        </label>

        <label>
          شماره تماس
          <input
            type="tel"
            name="phone"
            required
            inputmode="tel"
            maxlength="20"
          >
        </label>

        <label>
          ایمیل (اختیاری)
          <input
            type="email"
            name="email"
          >
        </label>

        <label>
          موضوع

          <select name="subject">
            <option>استعلام قیمت و موجودی</option>
            <option>پیگیری سفارش</option>
            <option>مشکل در ثبت سفارش</option>
            <option>سایر موارد</option>
          </select>
        </label>

        <label class="wide">
          شرح درخواست

          <textarea
            name="message"
            rows="5"
            required
            maxlength="3000"
          ></textarea>
        </label>

        <button
          class="btn btn-orange wide"
          type="submit"
        >
          ثبت درخواست
        </button>

      </form>

      <!-- Ticket result -->
      <div id="supportResult"></div>

    </section>

  </main>

  <div id="toast" class="toast"></div>

  <!-- Configuration -->
  <script src="assets/config.js"></script>

  <!-- Main application -->
  <script src="assets/app.js"></script>

  <!-- Support functionality -->
  <script src="assets/support.js"></script>

</body>
</html>
